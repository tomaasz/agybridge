name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test and lint dependencies
        run: python -m pip install --disable-pip-version-check 'pytest>=8,<9' 'ruff>=0.9,<1'
      - name: Run plugin contract tests
        run: python -m pytest -q -o 'addopts=' tests/test_agy_provider.py
      - name: Compile and lint
        run: |
          python -m py_compile plugins/model-providers/agy/__init__.py plugins/model-providers/agy/client.py
          ruff check plugins tests
          ruff format --check plugins tests
          git diff --check
